    <script>
        // 心靈小品文章庫
        const ARTICLES = [
            {
                vol: "系列（一）",
                title: "神點解揀咗我做妳爸爸？",
                subtitle: "身份的掙扎 —— 「我是否一個合資格的爸爸？」",
                description: "面對女兒天真的一問，爸爸摸著下巴，從不羈的冷笑話裡，看見了神精準的揀選與恩典塑造。",
                theater: `星期六晚上，爸爸陪女兒收拾好餐桌。兩個人坐喺客廳，一邊食雪糕，一邊傾偈。
女兒忽然抬起頭，認真咁問：
「爸爸，點解神揀咗你做我爸爸？」

爸爸愣了一愣。呢條問題，比工作上任何一個難題都難答。
爸爸摸摸下巴，一本正經咁答：
「可能因為爸爸玉樹臨風，不羈之中帶點冷傲，係一個超乎常人極限嘅人。」

女兒眨眨眼，一臉疑惑：「超……咩人？」
爸爸忍住笑：「超人。」說罷自己忍唔住哈哈大笑。
女兒望住爸爸，笑住搖頭：「爸爸，你又講冷笑話。」

爸爸笑了一會，慢慢收起笑容。
「其實，爸爸真係唔知道點解神揀咗我。」
「爸爸知道自己唔完美。有時冇耐性，有時會做錯，有時仲會惹妳唔開心。」
「但爸爸相信，神從來唔會揀錯。祂將妳交畀爸爸，唔係因為爸爸最好，而係因為祂要爸爸一路依靠祂，一路學習點樣愛妳、保護妳，同埋帶妳認識祂。」

女兒靜靜望住爸爸，然後輕輕靠喺爸爸肩膀。過咗一陣，她細細聲咁講：
「爸爸，我都覺得神冇揀錯。」
爸爸冇再講嘢，只係輕輕攬住女兒。那一刻，爸爸心裡充滿感恩。`,
                bibleText: "「兒女是耶和華所賜的產業；所懷的胎是祂所給的賞賜。」",
                bibleVerse: "—— 詩篇 127:3",
                thoughts: `每一位爸爸，都曾經問過自己：「我做得夠好嗎？」
成為爸爸之後，我們每天都有不同的責任：工作、接送、煮飯、陪功課、處理家中的大小事情。有時候，我們很努力想給孩子最好的生活；但在忙碌之中，卻忘記停下來思想：女兒不是我的成就，而是神交託給我的禮物。

我們很容易以為，神揀選成為爸爸的人，應該是成熟、有智慧、有耐性的人。但如果真是這樣，相信沒有一個人夠資格。因為我們都會疲倦，都會發脾氣，都會說錯話，也會有做得不好的時候。

然而，神的恩典就在這裡：祂不是等我們成為完美爸爸，才把女兒交給我們。祂是在把女兒交給我們的同時，也開始塑造我們成為更好的爸爸。原來，在養育女兒的過程中，神也在養育爸爸。

每一次願意聆聽，每一次放下面子道歉，每一次放下手機陪伴，每一次陪女兒禱告，都是神在我們生命中工作的時刻。神沒有把女兒交給一位完美的爸爸。祂把女兒交給一位願意依靠祂、願意學習愛的爸爸。`,
                reflection: `你有沒有曾經覺得：「我可能不是一個好爸爸？」
也許今天神想提醒你：做爸爸，不是因為你已經準備好；而是在成為爸爸的旅程中，神一直陪伴你成長。
女兒需要的，不是一個永遠不犯錯的爸爸。她需要的是一個願意愛她、願意改變、願意帶她走向神的爸爸。`,
                prayer: `親愛的天父，
感謝祢把女兒交託給我。我承認自己不是一個完美的爸爸。我會疲倦，會軟弱，會做錯，也有很多需要學習的地方。
但感謝祢，祢不是因為我的能力才揀選我，而是在祢的恩典中呼召我成為爸爸。
求祢賜我智慧，讓我懂得怎樣愛她；求祢賜我耐心，讓我懂得怎樣陪伴她；更求祢幫助我，讓我的生命成為她認識祢的一扇窗。
願我的女兒不單從我的說話，更從我的生命，看見天父的慈愛、信實和恩典。
奉主耶穌基督的名祈求，
阿們。`
            },
            {
                vol: "系列（二）",
                title: "唔好意思，爸爸都係第一次做爸爸",
                subtitle: "面子的掙扎 —— 「承認軟弱，也是一種力量。」",
                description: "當大人在忙碌或疲憊中對孩子大聲說話，拉下面子說一聲「對不起」，需要的是勇氣，還是對神的順服？",
                theater: `晚飯後，女兒倒翻了果汁，糖水沾濕了剛剛做好的手作。
爸爸一天的疲倦登時爆發：「妳點解做嘢總是咁唔小心？講咗好多次唔好放喺邊邊！」
女兒嚇得縮了縮肩膀，眼眶泛紅，咬著嘴唇不敢說話。

空氣安靜得可怕。爸爸轉身走入廚房拿抹布，看著水龍頭的流水，心裡充滿懊悔。
明明今天工作上被客戶責難，自己憋了一肚子氣。
女兒只是不小心，我卻把氣撒在最愛的人身上。

心底有一個聲音：「去跟她道歉吧。」
但另一個聲音說：「我是爸爸，如果向小孩認錯，以後怎麼管教？」

爸爸深呼吸，關掉水龍頭。回到客廳蹲在女兒身邊：
「對唔起，剛才爸爸太惡。爸爸是因為今天工作累了，亂發脾氣，不是因為妳不好。」
女兒眨了眨含著淚光的眼睛，伸出小手抱住爸爸：
「唔緊要，爸爸。我都唔小心整污糟咗。我陪你一齊抹。」`,
                bibleText: "「我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。」",
                bibleVerse: "—— 哥林多後書 12:9",
                thoughts: `在傳統的觀念裡，爸爸似乎必須代表權威、代表「正確」和「永遠強大」。我們害怕在孩子面前暴露缺點，更害怕向孩子低頭，認為這樣會喪失尊嚴。

然而，聖經卻給了我們一個相反的智慧：承認自己的軟弱，神的恩典才能彰顯。
當我們對孩子說一聲「對不起」時，我們其實是在向孩子展示：爸爸也是一個需要耶穌拯救的罪人。我們不是完美的上帝，我們只是和他們一起在恩典中學習的罪人。

道歉，不會讓我們失去權威；相反，這能建立真實的信任。當孩子看見爸爸在做錯事時願意謙卑、尋求原諒，他們也學會了在神面前如何悔改、如何與人和好。`,
                reflection: `你上一次對孩子（或對身邊的人）說「對不起」是什麼時候？
放下作長輩、作丈夫、作爸爸的面子，背後最大的支撐力，是我們知道天父也同樣天天用恩典寬容我們的過犯。`,
                prayer: `親愛的天父，
要在孩子面前承認做錯，真的很難。我的驕傲、我的面子，常常攔阻我承認自己的不完美。
主啊，求祢賜我謙卑的心。讓我看見，我不需要假裝成為一個不會犯錯的神。相反，當我對女兒真誠地坦露軟弱、尋求原諒時，祢的愛和恩典就流淌在我們之間。
求祢保守我們的家，成為一個充滿饒恕、恩典與溫暖的地方。
奉主耶穌基督的名祈求，
阿們。`
            },

            {
                vol: "系列（三）",
                title: "爸爸，你可唔可以唔好咁多意見？",
                subtitle: "聆聽的功課 —— 「有時候，愛就是先聽我講完。」",
                description: "女兒只想找爸爸傾訴，爸爸卻急著提供解決方法。當一句 dad joke 也無法化解尷尬，爸爸才發現，原來聆聽也是一種愛的功課。",
                theater: `某晚，女兒放學回家，面帶愁容。
女兒：「Daddy，今日學校有件事令我好唔開心……」
爸爸立即放下手機，進入「爸爸問題解決模式」。
爸爸：「係咩事？邊個做嘅？妳有冇同老師講？下次妳可以咁樣做……」
女兒：「Daddy，我仲未講完喎！」
爸爸：「哦，好，妳繼續。」
女兒講了兩句。
爸爸：「等陣！爸爸諗到一個更好嘅方法……」
女兒終於忍唔住：
「Daddy！我只係想你聽我講，唔係想你教我點做呀！」
爸爸愣了一愣。
「哦……原來係咁。咁爸爸而家做一個稱職嘅聆聽者！」
女兒：「即係點？」
爸爸一本正經咁答：
「即係……我會洗耳恭聽！」
女兒望住爸爸，無奈地說：
「Daddy，你可唔可以唔好連聽人講嘢都要講 dad joke？」
爸爸摸摸鼻子：
「好啦好啦！爸爸今次一定唔會再打斷妳。」

三秒後。
爸爸：「不過呢……」
女兒：「DADDY！！！」
爸爸終於閉上嘴巴。

過了一會，爸爸收起笑容，輕輕坐到女兒身旁。
「對唔住呀，頭先爸爸太心急，一心只想幫妳解決問題，反而冇好好聽妳講。」
女兒低著頭，小聲說：
「我今日喺學校真係好唔開心。我只係想搵個人聽我講吓。」
爸爸點點頭：

                bibleText: "「我親愛的弟兄們，這是你們所知道的，但你們各人要快快地聽，慢慢地說，慢慢地動怒。」",
                bibleVerse: "—— 雅各書 1:19",
                thoughts: `做爸爸的，有時真的很容易進入「問題解決模式」。

女兒遇到困難，我們便想分析原因、提供方法、分享自己的經驗，希望她少走冤枉路。我們以為，這就是愛她的表現。

但有時候，我們太急著幫她解決問題，反而忘記先了解她的感受。

女兒說今天在學校不開心，我們可能立即問：「妳有冇同老師講？」「妳下次可以點做？」這些問題本身沒有錯，甚至可能很有幫助。但如果我們還未聽完，就急著給答案，女兒可能會覺得，爸爸關心的是怎樣解決事情，而不是她正在經歷甚麼。

聖經提醒我們要「快快地聽，慢慢地說」。這不只是待人接物的智慧，也是學習愛人的功課。

聆聽並不代表我們不再管教孩子，也不代表孩子說甚麼都是對的。聆聽是讓我們在回應之前，先了解事情的全貌，也讓孩子知道，她的感受和想法值得被認真對待。

其實，女兒長大之後，願不願意繼續跟爸爸分享心事，未必只取決於爸爸能提供多少好建議，也取決於她是否相信，爸爸會願意聽她說話。

更重要的是，我們在天父面前，不也常常帶著許多憂慮和不明白嗎？我們需要學習信靠祂，也需要學習把同樣的耐心和關懷帶進與家人的相處之中。

有時候，做一個好爸爸，不是急著說出最好的答案，而是願意先放下自己的答案。

少一點打斷，多一點聆聽；少一點急著教導，多一點耐心陪伴。這些看似微小的改變，卻可能讓女兒更深地感受到愛。

至於 dad joke……當然可以繼續講。不過，最好等女兒講完先！`,
    reflection: `當女兒向你分享煩惱時，你通常會先聆聽，還是立即提供解決方法？

            {

                title: "爸爸，我有咩恩賜？",
                subtitle: "恩賜的迷思 —— 「我不需要成為別人，只需要忠心做好神交託我的事。」",
                description: "當女兒羨慕別人的才華，開始懷疑自己有沒有恩賜，爸爸本想用冷笑話回答，卻在一場父女對話中重新思想：恩賜不是用來比較，而是用來祝福別人。",
                theater: `星期六下午，爸爸坐在餐桌前，陪女兒做學校的功課。

女兒一邊畫畫，一邊嘆氣。

爸爸問：「做咩呀？幅畫唔聽妳話？」

女兒搖搖頭：
「唔係呀。學校要我哋寫自己有咩 strengths，即係優點同長處。我諗咗好耐，都唔知自己有咩特別叻。」

爸爸放下手上的咖啡：
「點解咁諗？」

女兒說：
「有啲同學唱歌好好聽，有啲畫畫好叻，有啲跑步好快。教會又有人識彈琴、有人識帶敬拜、有人好識講嘢……我好似乜都唔係特別出色。」

爸爸摸摸下巴，一本正經地說：
「咁妳有一樣嘢好叻喎！」

女兒眼睛一亮：
「真㗎？係咩？」

爸爸：
「妳好叻……食爸爸買嘅零食！」

女兒望住爸爸：
「Daddy！呢個唔係恩賜呀！」

爸爸忍住笑：
「咁妳食零食嘅恩賜，可能仲未被教會發掘啫。」

女兒無奈地笑了一下，然後認真地問：
「爸爸，咁我究竟有冇恩賜？神有冇俾啲咩我？」

爸爸本來想再講個笑話，這次卻停了下來。

「其實，爸爸有時都會諗呢個問題。」

女兒有點驚訝：
「吓？爸爸你都有？」

爸爸點點頭：
「梗係啦！見到人哋講道講得好、有音樂才華、又識帶領人，爸爸有時都會諗，自己究竟有咩可以為神做。」

他停了一停，接著說：
「但係，妳知唔知？恩賜唔係用嚟證明自己比人叻，亦唔係要同其他人比較。神俾我哋唔同嘅恩賜，係想我哋用自己所有嘅，去服事同祝福身邊嘅人。」

女兒低頭看著自己的畫：
「但如果我冇一樣特別出色嘅嘢，可以點呀？」

爸爸望著她：
「妳記唔記得上次教會有個小朋友，第一次返嚟，坐喺度唔敢同人講嘢？」

女兒點頭。

「嗰陣係妳主動走過去陪佢，帶佢一齊玩，仲介紹其他小朋友俾佢識。妳有冇諗過，對一個好緊張、唔識人嘅小朋友嚟講，妳嘅陪伴可能好重要？」

女兒想了一想：
「但我只係同佢玩咋喎。」

爸爸微笑：
「係呀。有時候，我哋以為要做啲好大、好特別嘅事先叫服事。但可能只係有人願意陪伴、願意聆聽、願意主動關心，已經可以成為別人嘅祝福。」

女兒沉默了一會，問：
「咁即係話，我唔需要好叻先可以俾神使用？」

爸爸點點頭：
「我哋當然可以繼續學習、發掘同發展神俾我哋嘅恩賜。但我哋唔需要等到自己好叻、好有信心、乜都識晒，先開始服事人。」

女兒望著爸爸，突然問：
「咁爸爸你嘅恩賜係咩？」

爸爸立即挺起胸膛：
「爸爸嘅恩賜就係……」

女兒滿懷期待地等著。

爸爸：
「講 dad jokes！」

女兒即刻掩住耳朵：
「呢個恩賜可唔可以唔好再發展呀？」

爸爸哈哈大笑：
「好啦好啦！不過，爸爸希望自己除咗識講冷笑話，仲可以學習做一個願意聆聽、願意陪伴人嘅爸爸。」

女兒笑著說：
「咁爸爸，你都要繼續發掘自己嘅恩賜喎！」

爸爸點頭：
「Deal！我哋一齊學習。」

女兒重新拿起畫筆，繼續完成自己的功課。

爸爸看著女兒，心裡默默感謝神。

原來，發掘恩賜不一定要從一件驚天動地的大事開始。有時候，只要願意忠心做好眼前的小事，已經是學習成為神百般恩賜的好管家。`,
            bibleText: "「各人要照所得的恩賜彼此服事，作神百般恩賜的好管家。」",
            bibleVerse: "—— 彼得前書 4:10",
            thoughts: `談到恩賜，我們很容易想到一些看得見、聽得到的能力：有人唱歌很好聽，有人很有音樂天分，有人善於教導，有人很有領導能力，也有人能夠清楚地分享神的話語。

當我們看見別人的恩賜，可能會受到激勵；但有時候，也會不自覺地拿自己與別人比較，然後問：「為甚麼他有這麼多才華，我卻好像沒有甚麼特別的地方？」

做爸爸的，我們也可能有這樣的掙扎。

在教會裡，我們看見別人有很大的服事果效；在工作上，我們看見別人有出色的能力；在家庭中，我們又可能覺得自己不夠有耐性、不夠有智慧，甚至不知道自己究竟能為神做甚麼。

然而，彼得前書 4:10 提醒我們，各人要照所得的恩賜彼此服事。

這節經文讓我們看見，恩賜的重點不在於我們擁有多少能力，也不在於我們是否比別人出色，而在於我們如何運用神所賜予的，去服事別人。

恩賜不是一張用來證明自己價值的成績表，也不是讓我們彼此比較的排行榜。它更像是一份託付：神把不同的能力、機會和責任交給我們，讓我們成為別人的祝福。

當然，我們仍然需要認識自己、發掘恩賜，並且透過學習和實踐不斷成長。有時候，我們甚至未必知道自己的恩賜是甚麼，需要在服事中慢慢發現，也可以請教成熟的弟兄姊妹，讓他們幫助我們看見自己的長處。

我們也要記得，並不是每一項優點或日常技能都必然是聖經所說的屬靈恩賜。但神可以使用我們的性格、經驗、能力，以及願意服事人的心，去成就祂的工作。

對爸爸而言，這個提醒尤其重要。

我們可能沒有站在講台上的恩賜，卻可以在家中教導女兒認識神；我們可能不擅長公開分享，卻可以在女兒難過時耐心聆聽；我們可能沒有顯眼的服事崗位，卻可以透過每天的陪伴、鼓勵和禱告，讓女兒在生活中看見神的愛。

這些事情未必引人注目，卻不代表它們沒有價值。

而且，做爸爸本身也不是一項可以簡單歸類為屬靈恩賜的能力。它是一份神所交託的責任，讓我們有機會在家庭中學習愛、忍耐、教導和服事。

我們不需要因為自己沒有別人的恩賜而灰心，也不應該因為擁有某種恩賜而自高。因為我們都是領受恩典的人，也都是需要繼續成長的人。

最重要的問題，不是「我有沒有別人那麼厲害」，而是「神已經交託給我的，我有沒有忠心地運用？」

也許，神今天不是要我們成為另一個更出色的人，而是邀請我們在祂所安排的位置上，忠心地成為祂所喜悅的人。`,
            reflection: `你曾否因為看見別人的恩賜，而覺得自己好像沒有甚麼特別之處？

你有沒有認真想過，自己有哪些能力、性格特質或生活經驗，可以用來服事和祝福別人？

今個星期，不妨做三件小事：

第一，花一點時間思想自己比較擅長甚麼，以及別人曾經肯定過你哪些地方。

第二，問一位你信任的弟兄姊妹：「你覺得神可以怎樣使用我去服事別人？」有時候，別人看見的恩賜，是我們自己未曾留意的。

第三，選擇一件具體的小事去祝福別人。可能是主動關心一位有需要的朋友、陪伴一個孤單的人，或者在家庭中多花一點時間聆聽女兒。

不要只停留在發掘恩賜，也要學習運用神交託給你的。

作為爸爸，我們亦可以陪伴女兒認識自己的恩賜，幫助她欣賞別人的長處，而不是與別人比較。

記住：我們不需要成為所有人，才能成為神手中合用的人。`,
            prayer: `親愛的天父，

感謝祢創造了不同的人，也賜給我們不同的能力、機會和恩賜。

主啊，有時候我會看見別人的長處，便覺得自己不夠好；有時候我也不太清楚，祢可以怎樣使用我。

求祢幫助我認識自己，讓我看見祢已經交託給我的恩賜和責任。求祢賜我謙卑的心，不因自己的長處而驕傲，也不因自己不如別人而灰心。

求祢教導我，不單懂得發掘恩賜，更懂得忠心地運用恩賜去服事別人，成為別人的祝福。

求祢也幫助我成為女兒的好榜樣，教導她欣賞別人的長處，也勇敢地發掘自己從祢領受的恩賜，不讓比較和自卑限制她的成長。

求祢讓我們一家都成為祢恩典的好管家，在平凡的生活中忠心服事，在不同的崗位上榮耀祢。

奉主耶穌基督的名祈求，
阿們。`
}

                if(textVerse) textVerse.className = "block text-xs uppercase tracking-wider not-italic text-brand-lightMuted";

            } else if (theme === 'sepia') {
                body.classList.add('theme-sepia');
                
                body.className = "bg-brand-sepiaBg text-brand-sepiaText font-sans transition-colors duration-300 min-h-screen";
                nav.className = "sticky top-0 z-40 bg-brand-sepiaCard border-brand-sepiaBorder text-brand-sepiaText border-b backdrop-blur bg-opacity-95";
                footer.className = "border-t border-brand-sepiaBorder py-8 text-center text-xs text-brand-sepiaMuted";
                themeGroup.className = "flex items-center rounded-full p-1 border border-brand-sepiaBorder bg-brand-sepiaBg";
                
                setActiveThemeButton('sepia');

                fontControls.querySelectorAll('button').forEach(btn => {
                    btn.className = "w-8 h-8 rounded-lg flex items-center justify-center border border-brand-sepiaBorder text-brand-sepiaText bg-brand-sepiaCard hover:bg-brand-sepiaAccent transition-all";
                });
                toolSeparator.className = "h-5 w-px bg-brand-sepiaBorder";
                backBtn.className = `${displayClass} items-center gap-2 font-medium text-sm text-brand-sepiaMuted hover:text-brand-primary active:scale-95`;
                footerBackBtn.className = "inline-flex items-center gap-2 px-6 py-3 rounded-full border border-brand-sepiaBorder bg-brand-sepiaCard text-brand-sepiaMuted hover:text-brand-primary hover:bg-brand-sepiaAccent transition-all duration-300 hover:scale-105 active:scale-95";

                if(badgeTag) badgeTag.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase bg-brand-sepiaAccent text-brand-primary";
                if(homeTitle) homeTitle.className = "text-3xl md:text-4xl font-serif font-bold tracking-wider text-brand-primary";
                if(homeDesc) homeDesc.className = "text-sm md:text-base leading-relaxed text-brand-sepiaMuted";

                if(articleHeader) articleHeader.className = "text-center space-y-4 border-b border-brand-sepiaBorder pb-8";
                cards.forEach(card => {
                    if(card) {
                        if (card.id === 'cardPrayer') {
                            card.className = "rounded-2xl p-6 md:p-8 border-2 border-dashed border-brand-secondary bg-brand-sepiaBg shadow-sm space-y-4";
                        } else {
                            card.className = "rounded-2xl p-6 md:p-8 border border-brand-sepiaBorder bg-brand-sepiaCard shadow-sm space-y-4";
                        }
                    }
                });
                if(cardBible) cardBible.className = "rounded-2xl p-8 border border-brand-sepiaBorder bg-brand-sepiaAccent text-center space-y-4 shadow-sm";
                if(titleBible) titleBible.className = "inline-flex items-center gap-2 justify-center font-bold text-lg text-brand-primary";
                if(textVerse) textVerse.className = "block text-xs uppercase tracking-wider not-italic text-brand-sepiaMuted";

            } else if (theme === 'dark') {
                body.classList.add('theme-dark');
                
                body.className = "bg-brand-darkBg text-brand-darkText font-sans transition-colors duration-300 min-h-screen";
                nav.className = "sticky top-0 z-40 bg-brand-darkCard border-brand-darkBorder text-brand-darkText border-b backdrop-blur bg-opacity-95";
                footer.className = "border-t border-brand-darkBorder py-8 text-center text-xs text-brand-darkMuted";
                themeGroup.className = "flex items-center rounded-full p-1 border border-brand-darkBorder bg-brand-darkBg";
                
                setActiveThemeButton('dark');

                fontControls.querySelectorAll('button').forEach(btn => {
                    btn.className = "w-8 h-8 rounded-lg flex items-center justify-center border border-brand-darkBorder text-brand-darkText bg-brand-darkCard hover:bg-brand-darkAccent transition-all";
                });
                toolSeparator.className = "h-5 w-px bg-brand-darkBorder";
                backBtn.className = `${displayClass} items-center gap-2 font-medium text-sm text-brand-darkMuted hover:text-brand-secondary active:scale-95`;
                footerBackBtn.className = "inline-flex items-center gap-2 px-6 py-3 rounded-full border border-brand-darkBorder bg-brand-darkCard text-brand-darkMuted hover:text-brand-secondary hover:bg-brand-darkAccent transition-all duration-300 hover:scale-105 active:scale-95";

                if(badgeTag) badgeTag.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase bg-brand-darkAccent text-brand-secondary";
                if(homeTitle) homeTitle.className = "text-3xl md:text-4xl font-serif font-bold tracking-wider text-brand-secondary";
                if(homeDesc) homeDesc.className = "text-sm md:text-base leading-relaxed text-brand-darkMuted";

                if(articleHeader) articleHeader.className = "text-center space-y-4 border-b border-brand-darkBorder pb-8";
                cards.forEach(card => {
                    if(card) {
                        if (card.id === 'cardPrayer') {
                            card.className = "rounded-2xl p-6 md:p-8 border-2 border-dashed border-brand-secondary bg-brand-darkBg shadow-sm space-y-4";
                        } else {
                            card.className = "rounded-2xl p-6 md:p-8 border border-brand-darkBorder bg-brand-darkCard shadow-sm space-y-4";
                        }
                    }
                });
                if(cardBible) cardBible.className = "rounded-2xl p-8 border border-brand-darkBorder bg-brand-darkAccent text-center space-y-4 shadow-sm";
                if(titleBible) titleBible.className = "inline-flex items-center gap-2 justify-center font-bold text-lg text-brand-secondary";
                if(textVerse) textVerse.className = "block text-xs uppercase tracking-wider not-italic text-brand-darkMuted";
            }
            
            // 同步卡片列表的顏色
            renderGridCards();
        }

        // 切換主題按鈕的高亮狀態
        function setActiveThemeButton(theme) {
            const themes = ['light', 'sepia', 'dark'];
            themes.forEach(t => {
                const btn = document.getElementById(`btn-theme-${t}`);
                if (btn) {
                    if (t === theme) {
                        btn.classList.add('bg-brand-primary', 'text-white', 'shadow-sm');
                        btn.classList.remove('opacity-60');
                    } else {
                        btn.classList.remove('bg-brand-primary', 'text-white', 'shadow-sm');
                        btn.classList.add('opacity-60');
                    }
                }
            });
        }

        // ==========================================
        // 🔍 字型放大與縮小 (A+ / A-)
        // ==========================================
        function adjustFontSize(dir) {
            const contentElements = [
                document.getElementById('textTheater'),
                document.getElementById('textThoughts'),
                document.getElementById('textReflection'),
                document.getElementById('textPrayer')
            ];
            
            const sizes = ['text-sm', 'text-base', 'text-lg', 'text-xl', 'text-2xl'];
            let currIndex = sizes.indexOf(currentFontSizeClass);
            
            if (dir > 0 && currIndex < sizes.length - 1) {
                currIndex++;
            } else if (dir < 0 && currIndex > 0) {
                currIndex--;
            }
            
            // 移除舊的字型大小，套用新的
            contentElements.forEach(el => {
                if (el) {
                    el.classList.remove(currentFontSizeClass);
                    el.classList.add(sizes[currIndex]);
                }
            });
            
            currentFontSizeClass = sizes[currIndex];
        }

        // ==========================================
        // 📚 渲染手記列表 (首頁網格卡片)
        // ==========================================
        function renderGridCards() {
            const grid = document.getElementById('storyGrid');
            if (!grid) return;
            
            const isDark = document.body.classList.contains('theme-dark');
            const isSepia = document.body.classList.contains('theme-sepia');
            
            let cardBg, cardBorder, tagBg, tagText, titleColor, descColor;
            
            if (isDark) {
                cardBg = "bg-brand-darkCard";
                cardBorder = "border-brand-darkBorder hover:border-brand-secondary";
                tagBg = "bg-brand-darkAccent";
                tagText = "text-brand-secondary";
                titleColor = "text-brand-darkText";
                descColor = "text-brand-darkMuted";
            } else if (isSepia) {
                cardBg = "bg-brand-sepiaCard";
                cardBorder = "border-brand-sepiaBorder hover:border-brand-primary";
                tagBg = "bg-brand-sepiaAccent";
                tagText = "text-brand-primary";
                titleColor = "text-brand-sepiaText";
                descColor = "text-brand-sepiaMuted";
            } else {
                cardBg = "bg-brand-lightCard";
                cardBorder = "border-brand-lightBorder hover:border-brand-primary";
                tagBg = "bg-brand-lightAccent";
                tagText = "text-brand-primary";
                titleColor = "text-brand-lightText";
                descColor = "text-brand-lightMuted";
            }
            
            grid.innerHTML = ARTICLES.map((article, index) => {
                // 如果是預告篇章
                if (article.isUpcoming) {
                    return `
                        <div class="rounded-2xl p-6 md:p-8 border border-dashed flex flex-col justify-between relative overflow-hidden transition-all duration-300 ${cardBg} ${cardBorder}">
                            <div class="space-y-4">
                                <div class="flex items-center justify-between">
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wider ${tagBg} ${tagText}">
                                        ${article.vol}
                                    </span>
                                    <span class="text-xs font-medium opacity-60">
                                        <i class="fa-solid fa-hourglass-start"></i> 提筆撰寫中
                                    </span>
                                </div>
                                <h3 class="text-xl font-serif font-bold ${titleColor}">
                                    ${article.title}
                                </h3>
                                <p class="text-sm leading-relaxed ${descColor}">
                                    ${article.description}
                                </p>
                            </div>
                            <div class="mt-8 flex items-center gap-2 text-xs font-medium opacity-60">
                                <span>敬請期待，下回溫馨呈獻</span>
                            </div>
                        </div>
                    `;
                }
                
                // 正常的已發布篇章
                return `
                    <div onclick="readArticle(${index})" class="rounded-2xl p-6 md:p-8 border cursor-pointer flex flex-col justify-between relative overflow-hidden transition-all duration-300 hover:shadow-md hover:-translate-y-1 active:scale-98 ${cardBg} ${cardBorder}">
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wider ${tagBg} ${tagText}">
                                    ${article.vol}
                                </span>
                                <span class="text-xs font-medium opacity-60">
                                    已經發布 <i class="fa-solid fa-chevron-right"></i>
                                </span>
                            </div>
                            <h3 class="text-xl font-serif font-bold ${titleColor}">
                                ${article.title}
                            </h3>
                            <p class="text-sm leading-relaxed ${descColor}">
                                ${article.description}
                            </p>
                        </div>
                        <div class="mt-8 flex items-center justify-end text-xs font-medium ${tagText}">
                            <span class="flex items-center gap-1">
                                開始閱讀 <i class="fa-solid fa-arrow-right"></i>
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // 📖 導航與閱讀控制
        // ==========================================
        function readArticle(index) {
            const data = ARTICLES[index];
            if (!data || data.isUpcoming) return;
            
            // 切換視圖
            document.getElementById('homepageView').classList.add('hidden');
            document.getElementById('readingView').classList.remove('hidden');
            
            // 頂部導航列按鈕與樣式調整
            document.getElementById('backBtn').classList.replace('hidden', 'flex');
            document.getElementById('logoContainer').classList.add('hidden');
            document.getElementById('fontControls').classList.replace('hidden', 'flex');
            document.getElementById('toolSeparator').classList.replace('hidden', 'block');
            
            // 寫入文章內容
            document.getElementById('articleVol').innerText = data.vol;
            document.getElementById('articleTitle').innerText = data.title;
            document.getElementById('articleSubtitle').innerText = data.subtitle;
            
            document.getElementById('textTheater').innerText = data.theater;
            document.getElementById('textBible').innerText = data.bibleText;
            document.getElementById('textVerse').innerText = data.bibleVerse;
            document.getElementById('textThoughts').innerText = data.thoughts;
            document.getElementById('textReflection').innerText = data.reflection;
            document.getElementById('textPrayer').innerText = data.prayer;

            // 套用當前的字體大小 class
            const textContainers = [
                document.getElementById('textTheater'),
                document.getElementById('textThoughts'),
                document.getElementById('textReflection'),
                document.getElementById('textPrayer')
            ];
            textContainers.forEach(el => {
                el.className = `leading-relaxed whitespace-pre-wrap ${currentFontSizeClass}`;
            });

            // 滾動到頂部
            window.scrollTo({ top: 0, behavior: 'instant' });
        }

        function goHome() {
            // 切換視圖
            document.getElementById('homepageView').classList.remove('hidden');
            document.getElementById('readingView').classList.add('hidden');
            
            // 頂部導航列還原
            document.getElementById('backBtn').classList.replace('flex', 'hidden');
            document.getElementById('logoContainer').classList.remove('hidden');
            document.getElementById('fontControls').classList.replace('flex', 'hidden');
            document.getElementById('toolSeparator').classList.replace('block', 'hidden');
            
            // 重新刷新網格（確保主題配色切換正確）
            renderGridCards();
            window.scrollTo({ top: 0, behavior: 'instant' });
        }

        // ==========================================
        // 🚀 初始化應用
        // ==========================================
        (function() {
            // 預設為護眼書香模式
            setTheme('sepia');
            // 渲染手記
            renderGridCards();
        })();
    </script>
</body>
</html>
